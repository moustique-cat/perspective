name: Site

# Tests every pull request and every push to main. Publishes to GitHub Pages from main.
#
# Whatever is pushed to the branch "dev" is published beside the site under /preview/, to be
# tried on real devices before it is merged:
#
#     git push --force origin HEAD:dev
#
# dev is a place to put a branch on show, not a branch to work on: it is overwritten each
# time, and it is not tested here (the branch's own pull request is).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The branch published under /preview/. It has to be allowed to deploy, once, in
  # Settings > Environments > github-pages. If the branch is deleted, the preview is gone
  # from the site at the next publish.
  PREVIEW_BRANCH: dev

jobs:
  test:
    name: Build and test
    # not for the preview: what is put on show there is tested by its own pull request
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: The original design files are untouched
        working-directory: design/original
        run: sha256sum --check SHA256SUMS

      - name: Unit tests (the site's code against the design's own code; the renderer's arithmetic against brute force)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (the built site against the original artboard; the renderer against the SVG)
        run: npm run test:e2e

      - name: Speed report (no graphics chip here, so its figures are a floor and a regression check)
        id: bench
        shell: bash
        run: npm run bench -- --check | tee bench.md

      - name: Put the speed report into the run's summary
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci-report.mjs --from=Machine: --outcome=${{ steps.bench.outcome }} 'Speed report: Linux, no graphics chip' bench.md

      - name: Keep the test output when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 14

  mac:
    # GitHub's Macs: the one place in CI where the browser may reach a graphics chip (a
    # virtual one: these are virtual machines, and slow at it). What it finds goes into the
    # run's summary and into two notices on the run; it does not gate publishing.
    name: On a Mac
    if: github.ref != 'refs/heads/dev'
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    concurrency:
      group: mac-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install chromium

      - name: The renderer on the graphics chip, if the browser can reach one
        id: chip
        shell: bash
        run: npm run test:e2e -- --project=chip | tee chip.txt

      # Only the half on the chip: the half in software is the Linux job's. The whole report
      # took 32 minutes here. Stopped after 30, it is reported as far as it got.
      - name: Speed report, on the chip
        id: bench
        timeout-minutes: 30
        shell: bash
        run: npm run bench -- --chip | tee bench.md

      - name: Put what was found into the run's summary
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci-report.mjs --notice --tail=70 --outcome=${{ steps.chip.outcome }} 'On the chip: macOS' chip.txt
          node scripts/ci-report.mjs --notice --from=Machine: --outcome=${{ steps.bench.outcome }} 'Speed report: macOS' bench.md

  assemble:
    # GitHub Pages holds one site per repository, so every publish carries both: the site
    # built from main at the root, unchanged, and the dev branch under /preview/.
    # From main, only once the tests have passed. From dev, straight away: its tests are skipped.
    name: Assemble the site
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/main' && needs.test.result == 'success')) }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The site, from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Is there a branch to preview?
        id: preview
        run: |
          if git -C main ls-remote --exit-code origin "refs/heads/$PREVIEW_BRANCH" > /dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: The preview, from its branch
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview

      - uses: actions/setup-node@v7
        with:
          node-version-file: main/.nvmrc

      - name: Build the site
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build the preview into /preview/
        if: steps.preview.outputs.exists == 'true'
        # From main, a preview that no longer builds is left out and the site is published
        # without it. From dev, it stops the run, and the site stays as it was.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        working-directory: preview
        run: |
          npm ci
          npm run build
          mv dist ../main/dist/preview

      - name: Check that GitHub Pages is switched on
        uses: actions/configure-pages@v6

      - name: Hand the built site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: main/dist

  deploy:
    name: Publish
    needs: assemble
    # Said outright: left to itself, a job is skipped when any job further up its chain was
    # skipped, and for dev the tests are.
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
