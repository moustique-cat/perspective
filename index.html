<script id="address-ink">
// An ink colour given in the address (?ink=26304A) has to be in place before the page is first
// styled: Chromium resolves the design's color-mix(currentColor ...) rules once and does not
// revisit them when the colour changes afterwards.
(function(m){if(m){var s=document.createElement('style');s.textContent='.ink{color:#'+m[1]+' !important}';document.head.appendChild(s)}})(/[?&]ink=(?:%23)?([0-9a-f]{6}|[0-9a-f]{3})(?:&|$)/i.exec(location.search))
</script>

<!--page-->
<script id="first-paint">
// Fits the drawing to this window and shows it, without waiting for the main script below.
// Same arithmetic as computeFrame() in src/frame.ts; tests/first-paint.test.ts keeps them equal.
// It stands back when the main script will start somewhere other than this first view: with
// ?cm or ?hand, or on arriving from the other drawing (?original added or removed) at its zoom.
(function(w,h,q){if(/[?&](cm|hand)(=|&|$)/.test(q))return;try{var p=JSON.parse(sessionStorage.getItem('perspective'));if(p&&p.o!=/[?&]original(=|&|$)/.test(q))return}catch(e){}var k=w>=760&&h>=560,s=Math.max(w/1280,h/820),x=(w-(k?248:0))/2,y=(k?.36:.3)*h;document.querySelector('.ink>svg').setAttribute('viewBox',(-x/s-(1280-w/s)/2).toFixed(2)+' '+(-y/s-(820-h/s)/2).toFixed(2)+' 1280 820');document.documentElement.className='ready'})(innerWidth,innerHeight,location.search)
</script>
<!--app-->
<script type="module" src="/src/main.ts"></script>
<!--deferred-->
