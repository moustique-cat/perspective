        cx: mcx.toFixed(2), cy: mcy.toFixed(2), r: mr.toFixed(2),
        f: smooth01((5 - rt) / 3).toFixed(3),
        lo: win(z, 1.9, 28.2, 0.3, 0.1).toFixed(3),
        leader: 'M' + (mcx + e45).toFixed(2) + ' ' + (mcy - e45).toFixed(2) + 'L36 -56H44'
      };
    }
    var lb = {};
    for (n in LAB) {
      p = LAB[n];
      o = win(z, p[5], p[6], 0.25, 0.25);
      if (vis(o)) {
        var kk = Math.pow(10, p[0] - z);
        lb[n] = { x: (p[1] * kk + p[3]).toFixed(1), y: (p[2] * kk + p[4]).toFixed(1), o: o.toFixed(3), d: 'inline' };
      } else {
        lb[n] = { x: '0', y: '0', o: '0', d: 'none' };
      }
    }
    var nr = nearest(z);
    var cur = nr.d < 0.55 ? nr.i : -1;
    var want = capFor(this.jump !== null ? this.jump : z, M, cm);
    var C = this.cap, live = C[C.on];
    if (want) {
      if (want.key === live.key) {
        live.t = want.t;
        live.d = want.d;
      } else {
        var off = C.on === 'a' ? 'b' : 'a';
        C[off] = { key: want.key, t: want.t, d: want.d };
        C.on = off;
      }
    }
    var capA = { t: C.a.t, d: C.a.d, o: C.on === 'a' ? '1' : '0', h: C.on === 'a' ? 'false' : 'true' };
    var capB = { t: C.b.t, d: C.b.d, o: C.on === 'b' ? '1' : '0', h: C.on === 'b' ? 'false' : 'true' };
    var self = this;
    var landmarks = LMS.map(function (l, j) {
      var on = j === cur;
      return { name: l.name, top: RAIL_TOPS[j], pick: self._picks[j], cur: on ? 'true' : 'false', fw: on ? '600' : '400' };
    });
    var ny = T0 + (ZMAX - z) / (ZMAX - ZMIN) * TH;
    var stageU = vwu - (desk ? RAIL_W / sc : 0);
    var Wm = Math.pow(10, z) * stageU / 1280;
    var widthStr = fmtLen(Wm);
    var nm = Wm / M;
    var lightStr = fmtTime(Wm / 299792458);
    var mousStr = nm >= 1 ? sig(nm) + (nm < 1.005 ? ' Moustique' : ' Moustiques') : sig(1 / nm) + ' of these span one Moustique';
    var st = this.state;
    return {
      vb: vb, km100: km100, iss: iss, pan: pan, catK: catK, winT: winT, v: v, ground: ground, earth: earth, grid: grid, atm: atm, sun: sun, marker: marker, lb: lb,
      pf: this.props.handDrawn ? 'url(#pencilB)' : 'none',
      ink: this.props.ink || '#141414',
      capA: capA, capB: capB,
      announce: (st && st.announce) || '',
      landmarks: landmarks,
      needle: 'translate(0 ' + ny.toFixed(1) + ')',
      widthStr: widthStr, mousStr: mousStr, lightStr: lightStr,
      z: z, zLabel: widthStr + ' across' + (cur >= 0 ? ', ' + LMS[cur].name : ''),
      hint: this.coarse ? 'drag or pinch to zoom' : 'scroll or pinch to zoom',
      onWheel: this._h.wheel, onRange: this._h.range, onRailKey: this._h.key,
      onPd: this._h.pd, onPm: this._h.pm, onPu: this._h.pu,
      flyOut: this._h.out, flyIn: this._h.inn, goHome: this._h.home,
      outLabel: playing === 1 ? 'Pause' : 'Fly out',
      inLabel: playing === -1 ? 'Pause' : 'Fly in',
      outIcon: playing === 1 ? ICON_PAUSE : ICON_OUT,
      inIcon: playing === -1 ? ICON_PAUSE : ICON_IN
    };
  }
}
